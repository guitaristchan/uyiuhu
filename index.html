<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미대 야구부 기록실(26 전반기)</title>
    <style>
        /* 깔끔하고 직관적인 UI/UX 스타일링 */
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #111; font-weight: 800; margin-bottom: 30px; }
        
        .search-container { max-width: 600px; margin: 0 auto 30px; display: flex; justify-content: center; }
        input[type="text"] { width: 100%; padding: 15px 25px; font-size: 16px; border: 2px solid #ddd; border-radius: 50px; outline: none; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input[type="text"]:focus { border-color: #ff6600; box-shadow: 0 4px 12px rgba(255,102,0,0.2); }
        
        .section-container { max-width: 1200px; margin: 0 auto 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        h2 { background: #2c3e50; color: #fff; margin: 0; padding: 18px 20px; font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 14px; }
        th, td { padding: 14px 16px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        th { background-color: #f8f9fa; font-weight: 700; color: #444; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f5f9; font-weight: 600; color: #000; }
        
        .hidden { display: none !important; }
        .no-data { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>

    <h1>⚾ 미대 야구부 기록실</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="선수끼리 비교를 해보세요 (예: 윤휘찬, 조창근)">
    </div>
    
    <div id="recordsContainer">
        <!-- CSV 데이터가 이 곳에 렌더링 됩니다 -->
    </div>

    <script>
        // 실시간 검색 필터링 로직 (다중 검색 및 vs 비교 지원)
        document.getElementById('searchInput').addEventListener('keyup', function() {
            // 'vs' 또는 ',' 를 기준으로 검색어를 나누고 공백을 제거함
            const rawValue = this.value.toLowerCase();
            const searchTerms = rawValue.split(/vs|,/).map(term => term.replace(/\s+/g, '')).filter(term => term.length > 0);
            
            const sections = document.querySelectorAll('.section-container');

            sections.forEach(section => {
                let hasVisibleRow = false;
                const rows = section.querySelectorAll('.data-row');
                
                rows.forEach(row => {
                    const nameCell = row.cells[1] ? row.cells[1].textContent.toLowerCase().replace(/\s+/g, '') : '';
                    const fallbackCell = row.cells[0] ? row.cells[0].textContent.toLowerCase().replace(/\s+/g, '') : '';
                    
                    let isMatch = false;
                    
                    // 검색어가 아무것도 없으면 기본적으로 모두 표시
                    if (searchTerms.length === 0) {
                        isMatch = true;
                    } else {
                        // 입력된 여러 검색어 중 하나라도 일치하면 화면에 띄움
                        isMatch = searchTerms.some(term => nameCell.includes(term) || fallbackCell.includes(term));
                    }

                    if (isMatch) {
                        row.classList.remove('hidden');
                        hasVisibleRow = true;
                    } else {
                        row.classList.add('hidden');
                    }
                });

                // 검색된 선수가 해당 표에 한 명도 없으면 그 표 자체를 숨김
                if (hasVisibleRow || searchTerms.length === 0) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
